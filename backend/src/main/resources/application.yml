# Cấu hình chung. Mọi bí mật (mật khẩu DB, JWT secret...) đọc từ biến môi trường.
# Khi chạy cục bộ, Spring tự nạp file .env ở thư mục gốc repo (nếu có) – xem .env.example.
spring:
  application:
    name: repairflow
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/repairflow}
    username: ${DB_USERNAME:repairflow}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false            # tránh lazy-load ngoài transaction (N+1 ẩn ở tầng view)
    hibernate:
      ddl-auto: validate           # schema do Flyway quản lý, Hibernate chỉ kiểm tra khớp
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  data.web.pageable:
    max-page-size: 100
    default-page-size: 20
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    jwt-secret: ${JWT_SECRET}                    # base64, >= 32 byte – app dừng khởi động nếu thiếu/yếu
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: ${AUTH_COOKIE_SECURE:true}    # trình duyệt chấp nhận cookie Secure trên http://localhost
    login-max-attempts: 5
    login-lock-duration: 15m
    password-reset-ttl: 30m
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    log-reset-links: false                       # chưa có SMTP; chỉ bật ở dev
  demo:
    password: ${DEMO_USER_PASSWORD:}             # dev: mật khẩu cho 4 tài khoản demo (để trống = không tạo)
