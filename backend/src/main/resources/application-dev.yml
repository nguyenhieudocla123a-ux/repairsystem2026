# Profile dev: log chi tiết hơn, bật Swagger.
logging:
  level:
    com.repairflow: DEBUG
    org.flywaydb: INFO

management:
  endpoint:
    health:
      show-details: always

app:
  auth:
    log-reset-links: true   # dev: in link đặt lại mật khẩu + mã xác nhận đăng ký ra log khi chưa đặt MAIL_HOST
